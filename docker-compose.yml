version: '3.8'

networks:
  student-network:
    driver: bridge

services:
  app:
    build: .
    container_name: student_app
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=student_user
      - DB_PASSWORD=student_pass_123
      - DB_NAME=student_db
    depends_on:
      - db
    networks:
      - student-network

  db:
    image: mysql:8.0
    container_name: student_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_123
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_user
      MYSQL_PASSWORD: student_pass_123
    networks:
      - student-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: student_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_pass_123
    depends_on:
      - db
    networks:
      - student-network

  nginx:
    image: nginx:alpine
    container_name: student_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - student-network
