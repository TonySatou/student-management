<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản Lý Sinh Viên</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Hệ Thống Quản Lý Sinh Viên</h1>

    <div class="card">
      <h2>Thêm Sinh Viên Mới</h2>
      <form id="student-form">
        <div class="form-group">
          <input type="text" id="mssv" placeholder="Mã Số Sinh Viên" required>
          <input type="text" id="fullname" placeholder="Họ và Tên" required>
        </div>
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
          <input type="text" id="major" placeholder="Ngành học" required>
          <input type="number" step="0.1" id="gpa" placeholder="Điểm GPA" required>
        </div>
        <button type="submit" class="btn btn-primary">Thêm Sinh Viên</button>
      </form>
    </div>

    <div class="card">
      <div class="table-header">
        <h2>Danh Sách Sinh Viên</h2>
        <input type="text" id="search-input" placeholder="Tìm kiếm theo tên / MSSV...">
      </div>
      <table>
        <thead>
          <tr>
            <th>MSSV</th>
            <th>Họ Tên</th>
            <th>Email</th>
            <th>Ngành</th>
            <th>GPA</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="student-list"></tbody>
      </table>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
